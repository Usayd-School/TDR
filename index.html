<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة المعلم - كشف المتابعة الرقمي 👨‍🏫</title>
    
    <meta name="theme-color" content="#4f46e5">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #f8fafc; --primary: #4f46e5; --secondary: #8b5cf6;
            --dark: #0f172a; --muted: #64748b; --surface: #ffffff;
            --border: #e2e8f0; --present: #22c55e; --absent: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--dark); padding-bottom: 50px; min-height: 100vh; }

        #loginPage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--secondary)); z-index: 9999; padding: 20px; }
        .login-card { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.95); border-radius: 24px; padding: 35px 25px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .login-card h2 { margin: 0 0 25px; color: var(--dark); font-weight: 900; font-size: 24px; }
        .inp { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 600; background: #f8fafc; outline: none; transition: 0.2s; margin-bottom: 12px; }
        .inp:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .btn-action { border: none; border-radius: 12px; padding: 12px 20px; background: linear-gradient(135deg,var(--primary),var(--secondary)); color: white; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; width: 100%; }

        .navbar { background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo-box { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-size: 18px; flex-shrink: 0;}
        .container { padding: 15px; max-width: 1200px; margin: auto; display: none; }

        .stats-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .stat-card { flex: 0 0 130px; scroll-snap-align: start; background: var(--surface); border-radius: 16px; padding: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .stat-card h4 { margin: 0; color: var(--muted); font-size: 11px; font-weight: 700; }
        .stat-card p { margin: 6px 0 0; font-size: 20px; font-weight: 900; color: var(--primary); }

        .control-panel { background: var(--surface); border-radius: 16px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--muted); }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .tab { scroll-snap-align: start; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--muted); transition: 0.3s; white-space: nowrap; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        .table-container { background: var(--surface); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: auto; max-height: 70vh; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: max-content; }
        th, td { padding: 8px 6px; text-align: center; border: 1px solid var(--border); }
        
        thead th { background: var(--dark); color: white; font-weight: 700; font-size: 12px; position: sticky; top: 0; z-index: 10; }
        thead th.sticky-col, tbody th.sticky-col { position: sticky; right: 0; z-index: 20; background: #f8fafc; text-align: right; border-left: 2px solid var(--primary); }
        thead th.sticky-col { z-index: 30; background: var(--dark); color: white; text-align: center; }
        tbody tr:nth-child(even) th.sticky-col { background: #f1f5f9; }
        
        .student-col { min-width: 220px; max-width: 250px; }
        .total-col { width: 60px; min-width: 60px; background:#f8fafc; color:var(--dark); font-size:11px; z-index:10; }

        .month-header { background: #1e293b !important; color: white !important; font-weight: 900;}
        .week-header { background: #334155 !important; color: #e2e8f0 !important; font-size: 11px; }
        .day-header { background: #475569 !important; color: white !important; font-size: 11px; padding: 6px !important;}
        
        .current-day-col { background: #e0e7ff !important; border-left: 2px solid var(--primary) !important; border-right: 2px solid var(--primary) !important; }
        .current-day-header { background: var(--primary) !important; color: white !important; border: 2px solid var(--secondary) !important;}

        .checkbox-wrapper { display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .attendance-cb { appearance: none; width: 22px; height: 22px; border: 2px solid #cbd5e1; border-radius: 6px; cursor: pointer; transition: 0.2s; position: relative; background: white; margin: 0; }
        .attendance-cb:checked { border-color: var(--present); background: var(--present); }
        .attendance-cb:checked::after { content: '✓'; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; font-weight: 900; }

        .summary-col { font-weight: 900; font-size: 13px; }
        
        .student-name-btn { color: var(--dark); font-weight: 900; font-size: 13px; margin-bottom: 4px; display: block; white-space: normal;}
        .student-sijil-note { font-size: 10px; color: var(--primary); padding: 4px; background: #e0e7ff; border-radius: 6px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; max-width: 200px;}
        .student-sijil-note:hover { background: #c7d2fe; }

        .hw-status-btn { width: 30px; height: 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; background: #fef3c7; border: 1px solid #fde68a; color: #d97706; transition: 0.2s; margin: auto; }
        .hw-status-btn.done { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .hw-status-btn.not-done { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        .exam-cell-inp { width: 45px; padding: 6px 4px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-weight: bold; font-family: sans-serif; font-size: 12px; }

        .clickable-header { cursor: pointer; transition: 0.2s; min-width: 70px;}
        .clickable-header:hover { opacity: 0.8; }
        .has-detail { color: #34d399 !important; }

        /* نوافذ منبثقة */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .popup-content { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 20px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; }
        .close-top-btn { position: absolute; top: 12px; left: 12px; background: rgba(239, 68, 68, 0.1); border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ef4444; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        #notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 12px 24px; border-radius: 50px; font-weight: 700; display: none; z-index: 6000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        /* تعديلات الجوال (Mobile Responsiveness) */
        @media (max-width: 768px) {
            body { padding: 10px; padding-bottom: 60px; }
            .navbar { padding: 12px; }
            .container { padding: 5px; }
            
            .stat-card { flex: 0 0 105px; padding: 10px; border-radius: 12px; }
            .stat-card h4 { font-size: 10px; }
            .stat-card p { font-size: 18px; margin-top: 4px; }
            
            .tab { padding: 8px 12px; font-size: 12px; }
            
            th, td { padding: 6px 4px; }
            .student-col { min-width: 140px; max-width: 160px; }
            .total-col { min-width: 50px; width: 50px; font-size: 10px; }
            
            .student-name-btn { font-size: 11px; margin-bottom: 2px; }
            .student-sijil-note { font-size: 9px; padding: 2px 4px; max-width: 130px; }
            
            .attendance-cb { width: 18px; height: 18px; border-radius: 4px; }
            .attendance-cb:checked::after { font-size: 11px; }
            
            .hw-status-btn { width: 26px; height: 26px; font-size: 11px; border-radius: 6px; }
            
            .month-header { font-size: 10px !important; }
            .week-header { font-size: 10px !important; }
            .day-header { font-size: 9px !important; padding: 4px 2px !important; }
            .day-header > div:nth-child(2) { font-size: 11px !important; }
        }
    </style>
</head>
<body>

<div id="notification">تم الحفظ ✓</div>

<div id="loginPage">
    <div class="login-card">
        <div class="logo-box" style="margin:0 auto 15px">ت</div>
        <h2>بوابة المعلم - الكشف</h2>
        <input type="text" id="userInp" class="inp" placeholder="اسم المستخدم (مثال: المعلم)">
        <button class="btn-action" onclick="checkAuth()">تسجيل الدخول</button>
        <p id="errorMsg" style="display:none; color:#ef4444; margin-top:12px; font-size:14px; font-weight:700;">بيانات الدخول غير صحيحة</p>
    </div>
</div>

<div id="mainApp" style="display: none;">
    <nav class="navbar">
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="logo-box">ت</div>
            <div>
                <h2 style="margin:0; font-size:15px; font-weight:900;">كشف المتابعة الرقمي</h2>
                <div id="displayTeacher" style="font-size:11px; color:var(--muted); margin-top:2px;">--</div>
            </div>
        </div>
    </nav>

    <div class="container" style="display: block;">
        
        <div class="stats-container">
            <div class="stat-card"><h4>إجمالي الطلاب</h4><p id="totalStds">0</p></div>
            <div class="stat-card"><h4>الواجبات المرسلة 📚</h4><p id="hwCount">0</p></div>
            <div class="stat-card"><h4>إجمالي الملاحظات 📝</h4><p id="notesCount">0</p></div>
            <div class="stat-card"><h4>المتميزون ✨</h4><p id="excCount">0</p></div>
        </div>

        <div class="control-panel">
            <div class="form-group">
                <label>الصف الدراسي</label>
                <select id="selGrade" class="inp" onchange="handleGradeChange()"></select>
            </div>
            <div class="form-group">
                <label>الفصل / الشعبة</label>
                <select id="selClassroom" class="inp" onchange="loadClassData()"></select>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('attendance', this)">📅 الحضور والغياب</div>
            <div class="tab" onclick="switchTab('participation', this)">⭐ المشاركة والتفاعل</div>
            <div class="tab" onclick="switchTab('homework', this)">📚 الواجبات (رصد فعلي)</div>
            <div class="tab" onclick="switchTab('exams', this)">📝 الدرجات (نظام نور)</div>
            <div class="tab" onclick="switchTab('behavior', this)">⚠️ المخالفات السلوكية</div>
        </div>

        <div class="table-container">
            <table id="mainTable">
                <thead id="tableHead"></thead>
                <tbody id="studentsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- نافذة السجل التاريخي وتفاصيل الواجبات -->
<div id="popupModal" class="modal-overlay">
    <div class="popup-content">
        <button class="close-top-btn" onclick="closePopup()">✕</button>
        <h3 id="popupTitle" style="margin-top:0; font-weight:900; color:var(--dark); text-align:center; padding-bottom:12px; border-bottom:2px solid #e2e8f0;">السجل</h3>
        <div id="popupContent" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCIW17B6y6sG_bdUFqF7FWoVIY9ynXv1B4",
    authDomain: "myschoolproject-4ad92.firebaseapp.com",
    databaseURL: "https://myschoolproject-4ad92-default-rtdb.firebaseio.com",
    projectId: "myschoolproject-4ad92",
    storageBucket: "myschoolproject-4ad92.appspot.com"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let loggedInTeacher = null;
let structuredGrades = {}; 
let currentClassStudents = {}; 
let evaluationsData = {}; 
let sheetDbData = {}; 
let globalHomeworks = []; 
let currentMode = 'attendance';

// التقويم الدراسي
const weeksData = [
    { name: "الأسبوع الأول", month: "صفر", days: [14, 15, 16, 17, 18] },
    { name: "الأسبوع الثاني", month: "صفر", days: [21, 22, 23, 24, 25] },
    { name: "الأسبوع الثالث", month: "صفر", days: [28, 29, 30, 1, 2] },
    { name: "الأسبوع الرابع", month: "ربيع أول", days: [5, 6, 7, 8, 9] },
    { name: "الأسبوع الخامس", month: "ربيع أول", days: [12, 13, 14, 15, 16] },
    { name: "الأسبوع السادس", month: "ربيع أول", days: [19, 20, 21, 22, 23] },
    { name: "الأسبوع السابع", month: "ربيع أول", days: [26, 27, 28, 29, 30] },
    { name: "الأسبوع الثامن", month: "ربيع ثاني", days: [3, 4, 5, 6, 7] },
    { name: "الأسبوع التاسع", month: "ربيع ثاني", days: [10, 11, 12, 13, 14] }
];
const dayNames = ['أ', 'إ', 'ث', 'أ', 'خ']; 
const currentSimulatedWeek = 8; 
const currentSimulatedDayIndex = 1; 

// أعمدة التقييم الخاصة بنظام نور
const noorExamCols = [
    { key: 'participation', label: 'المشاركة' },
    { key: 'homework', label: 'الواجبات' },
    { key: 'performance', label: 'المهام الأدائية' },
    { key: 'short_exams', label: 'اختبارات قصيرة' },
    { key: 'final_exam', label: 'اختبار نهاية الفصل' }
];

function cleanString(str) { return str ? str.toString().replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; }).trim() : ""; }

function checkAuth(){
    const u = cleanString(document.getElementById('userInp').value).toLowerCase();
    database.ref('assignments').once('value', snapshot=>{
        const data = snapshot.val() || {};
        let found = false; let combinedClasses = [];
        
        for(let key in data){
            if(data[key].teacherUser === u){
                loggedInTeacher = data[key]; found = true;
                data[key].className.split(',').forEach(c => {
                    let trimmed = c.trim();
                    if(trimmed && !combinedClasses.includes(trimmed)) combinedClasses.push(trimmed);
                });
            }
        }
        
        if(found){
            loggedInTeacher.className = combinedClasses.join(', ');
            document.getElementById('loginPage').style.display='none';
            document.getElementById('mainApp').style.display='block';
            startSession();
        } else {
            document.getElementById('errorMsg').style.display='block';
        }
    });
}

function startSession(){
    document.getElementById('displayTeacher').innerText = `المعلم: ${loggedInTeacher.teacherName} | المادة: ${loggedInTeacher.subject}`;
    structuredGrades = {};
    loggedInTeacher.className.split(',').forEach(rawItem => {
        const fullString = rawItem.trim();
        if(!fullString) return;
        
        let gradeKey = "أخرى / عام";
        if(fullString.match(/\d+/)) gradeKey = "الصف " + fullString.match(/\d+/)[0];
        else if(fullString.includes("ثاني")) gradeKey = "الصف الثاني";
        else if(fullString.includes("ثالث") || fullString.includes("ثالع")) gradeKey = "الصف الثالث";
        else if(fullString.includes("أول")) gradeKey = "الصف الأول";

        if(!structuredGrades[gradeKey]) structuredGrades[gradeKey] = [];
        if(!structuredGrades[gradeKey].includes(fullString)) structuredGrades[gradeKey].push(fullString);
    });

    const gradeSelect = document.getElementById('selGrade');
    gradeSelect.innerHTML = '';
    for (let grade in structuredGrades) { gradeSelect.innerHTML += `<option value="${grade}">${grade}</option>`; }
    handleGradeChange();
}

function handleGradeChange() {
    const selectedGrade = document.getElementById('selGrade').value;
    const classroomSelect = document.getElementById('selClassroom');
    classroomSelect.innerHTML = '';
    if(structuredGrades[selectedGrade]) {
        structuredGrades[selectedGrade].forEach(clsRoom => { classroomSelect.innerHTML += `<option value="${clsRoom}">${clsRoom}</option>`; });
    }
    loadClassData();
}

async function loadClassData() {
    const cls = document.getElementById('selClassroom').value;
    if(!cls) return;
    
    currentClassStudents = {};
    const snap = await database.ref('students').orderByChild('className').equalTo(cls).once('value');
    const allStudents = snap.val() || {};
    for(let key in allStudents){
        if(allStudents[key].schoolId === loggedInTeacher.schoolId) currentClassStudents[key] = allStudents[key].studentName || allStudents[key].name;
    }
    document.getElementById('totalStds').innerText = Object.keys(currentClassStudents).length;

    database.ref('evaluations/' + cls).on('value', evSnap => { 
        evaluationsData = evSnap.val() || {}; 
        processGlobalHomeworks();
        updateStats(); 
        renderTable(); 
    });

    database.ref('sheetData/' + cls).on('value', shSnap => { sheetDbData = shSnap.val() || {}; renderTable(); });
}

function processGlobalHomeworks() {
    let hwDict = {};
    for (let stdKey in evaluationsData) {
        if(!currentClassStudents[stdKey]) continue;
        for (let recKey in evaluationsData[stdKey]) {
            let r = evaluationsData[stdKey][recKey];
            
            // فلترة: جلب واجبات المعلم المسجل فقط
            if (r.teacherName && r.teacherName !== loggedInTeacher.teacherName) continue;

            if (r.homework && r.homework.trim() !== '') {
                let uKey = r.date + "||" + r.homework.trim();
                if (!hwDict[uKey]) hwDict[uKey] = { date: r.date, text: r.homework.trim(), students: {} };
                hwDict[uKey].students[stdKey] = { recKey: recKey, status: r.hwStatus || 'pending' };
            }
        }
    }
    
    globalHomeworks = Object.values(hwDict).sort((a,b) => {
        let dA = a.date.split('/').reverse().join('');
        let dB = b.date.split('/').reverse().join('');
        return dA.localeCompare(dB);
    });
}

function renderHeaders() {
    const thead = document.getElementById('tableHead');
    thead.innerHTML = '';
    
    let stickyCols = `
        <th class="sticky-col student-col">
            <div style="text-align: right;">اسم الطالب والسجل 📋</div>
        </th>
        <th class="total-col">
            الإجمالي
        </th>
    `;

    if (['attendance', 'participation', 'behavior'].includes(currentMode)) {
        let monthHtml = stickyCols, weekHtml = '', dayHtml = '';
        weeksData.forEach((w, wIdx) => {
            monthHtml += `<th colspan="5" class="month-header">${w.month}</th>`;
            weekHtml += `<th colspan="5" class="week-header">${w.name}</th>`;
            w.days.forEach((d, dIdx) => {
                let isCurr = (wIdx === currentSimulatedWeek && dIdx === currentSimulatedDayIndex);
                dayHtml += `<th class="day-header ${isCurr ? 'current-day-header' : ''}">
                    <div style="font-size:10px;">${dayNames[dIdx]}</div><div>${d}</div>
                </th>`;
            });
        });
        thead.innerHTML = `<tr>${monthHtml}</tr><tr>${weekHtml}</tr><tr>${dayHtml}</tr>`;
    } 
    else if (currentMode === 'homework') {
        let hwHtml = stickyCols;
        if(globalHomeworks.length === 0) {
            hwHtml += `<th class="day-header" style="min-width:200px; color:#cbd5e1; font-size:13px; font-weight:bold;">لا توجد واجبات مرسلة حالياً في المنصة</th>`;
        } else {
            globalHomeworks.forEach((hw, i) => {
                let encText = hw.text.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                hwHtml += `<th class="day-header clickable-header" onclick="showHwDetails('${hw.date}', '${encText}')" title="انقر لعرض تفاصيل الواجب">
                    <div class="has-detail" style="font-size:12px; font-weight:900;">واجب ${i + 1}</div>
                    <div style="font-size:9px; color:#cbd5e1; margin-top:2px;">📅 ${hw.date}</div>
                </th>`;
            });
        }
        thead.innerHTML = `<tr>${hwHtml}</tr>`;
    }
    else if (currentMode === 'exams') {
        let exHtml = stickyCols;
        noorExamCols.forEach(col => {
            exHtml += `<th class="day-header" style="min-width: 70px; font-size:11px; padding:10px 4px !important;">${col.label}</th>`;
        });
        thead.innerHTML = `<tr>${exHtml}</tr>`;
    }
}

function renderTable() {
    renderHeaders();
    const tbody = document.getElementById('studentsBody');
    tbody.innerHTML = '';
    
    let index = 1;
    for(let stdKey in currentClassStudents) {
        let stdName = currentClassStudents[stdKey];
        let tr = document.createElement('tr');
        
        let latestNote = "لا توجد ملاحظات سابقة";
        if(evaluationsData[stdKey]) {
            // فلترة: جلب الملاحظات التي تخص هذا المعلم فقط
            let records = Object.values(evaluationsData[stdKey]).filter(r => !r.teacherName || r.teacherName === loggedInTeacher.teacherName);
            let lastRec = records[records.length - 1]; 
            if(lastRec) {
                if(lastRec.hwStatus === 'not_done') latestNote = "❌ آخر رصد: لم ينجز الواجب";
                else if(lastRec.level === 'exc') latestNote = "✨ آخر رصد: متميز";
                else if(lastRec.level === 'we') latestNote = "⚠️ آخر رصد: ضعيف";
                else if(lastRec.message) latestNote = `💬 السجل: ${lastRec.message}`;
                else if(lastRec.homework) latestNote = `📚 أنجز: ${lastRec.homework}`;
            }
        }
        
        let nameTh = document.createElement('th');
        nameTh.className = "sticky-col student-col";
        nameTh.innerHTML = `
            <div class="student-name-btn">${index}. ${stdName}</div>
            <div class="student-sijil-note" onclick="showStudentHistory('${stdKey}', '${stdName}')" title="انقر لعرض السجل الكامل">📜 ${latestNote}</div>
        `;
        tr.appendChild(nameTh);

        let totalTd = document.createElement('td');
        totalTd.className = 'summary-col total-col';
        tr.appendChild(totalTd);

        let totalPoints = 0;
        
        if (['attendance', 'participation', 'behavior'].includes(currentMode)) {
            weeksData.forEach((w, wIdx) => {
                w.days.forEach((d, dIdx) => {
                    let dateKey = `w${wIdx}_d${dIdx}`;
                    let isChecked = sheetDbData[stdKey]?.[currentMode]?.[dateKey] || false;
                    if (isChecked) totalPoints++;
                    
                    let td = document.createElement('td');
                    if (wIdx === currentSimulatedWeek && dIdx === currentSimulatedDayIndex) td.className = 'current-day-col';
                    
                    let cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'attendance-cb'; cb.checked = isChecked;
                    if(isChecked) {
                        if(currentMode === 'participation') { cb.style.background = '#8b5cf6'; cb.style.borderColor = '#8b5cf6'; }
                        else if(currentMode === 'behavior') { cb.style.background = '#ef4444'; cb.style.borderColor = '#ef4444'; }
                    }
                    cb.addEventListener('change', (e) => {
                        database.ref(`sheetData/${document.getElementById('selClassroom').value}/${stdKey}/${currentMode}/${dateKey}`).set(e.target.checked);
                    });
                    
                    let wrap = document.createElement('label'); wrap.className='checkbox-wrapper'; wrap.appendChild(cb);
                    td.appendChild(wrap); tr.appendChild(td);
                });
            });
            if (currentMode === 'behavior' && totalPoints > 0) totalTd.style.color = 'var(--absent)';
            else if (totalPoints > 0) totalTd.style.color = 'var(--present)';
        } 
        else if (currentMode === 'homework') {
            if(globalHomeworks.length === 0) {
                let td = document.createElement('td'); td.innerText = '-'; tr.appendChild(td);
            } else {
                globalHomeworks.forEach((hw) => {
                    let td = document.createElement('td');
                    let studentHwData = hw.students[stdKey];
                    
                    if (studentHwData) {
                        let status = studentHwData.status;
                        let btn = document.createElement('button');
                        btn.className = 'hw-status-btn';
                        
                        if (status === 'done') { btn.innerText = '✅'; btn.classList.add('done'); totalPoints++; }
                        else if (status === 'not_done') { btn.innerText = '❌'; btn.classList.add('not-done'); }
                        else { btn.innerText = '⏳'; } 
                        
                        btn.onclick = () => {
                            let next = 'done';
                            if (status === 'done') next = 'not_done';
                            else if (status === 'not_done') next = 'pending';
                            
                            let cls = document.getElementById('selClassroom').value;
                            database.ref(`evaluations/${cls}/${stdKey}/${studentHwData.recKey}/hwStatus`).set(next);
                            showNotice("تم مزامنة حالة الواجب ✓");
                        };
                        td.appendChild(btn);
                    } else {
                        td.innerText = '-';
                        td.style.color = '#cbd5e1';
                        td.style.fontSize = '12px';
                    }
                    tr.appendChild(td);
                });
            }
            totalTd.style.color = 'var(--present)';
        }
        else if (currentMode === 'exams') {
            noorExamCols.forEach(col => {
                let grade = sheetDbData[stdKey]?.exams?.[col.key] || '';
                let numGrade = parseFloat(grade);
                if (!isNaN(numGrade)) totalPoints += numGrade;
                
                let td = document.createElement('td');
                let inp = document.createElement('input');
                inp.type = 'number'; inp.className = 'exam-cell-inp'; inp.value = grade;
                inp.placeholder = '-';
                
                inp.onblur = (e) => {
                    database.ref(`sheetData/${document.getElementById('selClassroom').value}/${stdKey}/exams/${col.key}`).set(e.target.value);
                };
                td.appendChild(inp); tr.appendChild(td);
            });
            totalTd.style.color = 'var(--primary)';
        }

        totalTd.innerText = totalPoints;
        tbody.appendChild(tr);
        index++;
    }
}

function switchTab(mode, element) {
    currentMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    element.classList.add('active');
    renderTable(); 
}

function updateStats() {
    let stats = { exc: 0, notes: 0, weak: 0 };
    for (let stdKey in evaluationsData) {
        if(!currentClassStudents[stdKey]) continue;
        for (let recKey in evaluationsData[stdKey]) {
            let r = evaluationsData[stdKey][recKey];
            
            // فلترة: حساب الإحصائيات التي تخص المعلم المسجل فقط
            if (r.teacherName && r.teacherName !== loggedInTeacher.teacherName) continue;

            if (r.level === 'exc') stats.exc++;
            if (r.level === 'we' || r.warning) stats.weak++;
            if (r.message && r.message.trim() !== '') stats.notes++;
        }
    }
    document.getElementById('excCount').innerText = stats.exc;
    document.getElementById('weakCount').innerText = stats.weak;
    document.getElementById('notesCount').innerText = stats.notes;
    document.getElementById('hwCount').innerText = globalHomeworks.length;
}

function showHwDetails(date, text) {
    document.getElementById('popupTitle').innerText = "تفاصيل الواجب 📚";
    document.getElementById('popupContent').innerHTML = `
        <div style="background:#f0fdf4; border:1px solid #bbf7d0; padding:15px; border-radius:12px; font-size:13px; line-height:1.6;">
            <div style="color:var(--primary); font-weight:bold; margin-bottom:8px;">التاريخ: ${date}</div>
            <div style="color:var(--dark); font-weight:600; white-space:pre-wrap;">${text}</div>
        </div>
    `;
    document.getElementById('popupModal').style.display = 'flex';
}

function showStudentHistory(stdKey, stdName) {
    const data = evaluationsData[stdKey];
    let listHTML = "";
    if(data) {
        // فلترة: جلب الملاحظات التي تخص هذا المعلم فقط
        let records = Object.values(data).filter(r => !r.teacherName || r.teacherName === loggedInTeacher.teacherName).reverse();
        
        if(records.length === 0) {
            listHTML = `<div style="text-align:center; color:var(--muted); font-weight:700; padding:20px; font-size:13px;">لا توجد سجلات سابقة لهذا الطالب من قبلك</div>`;
        } else {
            records.forEach((r, i) => {
                let levelLabel = r.level === 'exc' ? "✨ متميز" : r.level === 'we' ? "⚠️ ضعيف" : r.level === 'vg' ? "👍 جيد جدا" : "";
                listHTML += `
                <div style="background:#f8fafc; border-right:4px solid var(--secondary); padding:10px; border-radius:12px; margin-bottom:8px; border-left: 1px solid var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);">
                    <div style="font-size:10px; color:var(--muted); margin-bottom:6px; font-weight:700;">${i+1}. 🕒 ${r.date}</div>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        ${levelLabel ? `<span style="background:#e0e7ff; color:var(--primary); padding:3px 6px; border-radius:6px; font-size:10px; font-weight:700;">${levelLabel}</span>` : ''}
                        ${r.homework ? `<span style="background:#fff; color:var(--dark); padding:3px 6px; border-radius:6px; font-size:10px; font-weight:700; border:1px solid #cbd5e1;">📚 ${r.homework}</span>` : ''}
                        ${r.hwStatus === 'not_done' ? `<span style="background:#fee2e2; color:#ef4444; padding:3px 6px; border-radius:6px; font-size:10px; font-weight:700;">❌ لم ينجز الواجب</span>` : ''}
                    </div>
                    ${r.message ? `<div style="font-size:11px; color:var(--dark); margin-top:6px; background:#fff; padding:6px; border-radius:8px; font-weight:600; border:1px solid #cbd5e1;">💬 ${r.message}</div>` : ''}
                </div>`;
            });
        }
    } else {
        listHTML = `<div style="text-align:center; color:var(--muted); font-weight:700; padding:20px; font-size:13px;">لا توجد سجلات سابقة لهذا الطالب</div>`;
    }
    document.getElementById('popupTitle').innerText = `السجل الشامل لـ: ${stdName}`;
    document.getElementById('popupContent').innerHTML = listHTML;
    document.getElementById('popupModal').style.display = 'flex';
}

function closePopup() { document.getElementById('popupModal').style.display = 'none'; }
function showNotice(msg = "تم الحفظ ✓") {
    const n = document.getElementById('notification');
    n.innerText = msg;
    n.style.display = 'block';
    setTimeout(() => { n.style.display = 'none'; }, 1500);
}
</script>
